<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRVTCHAT — Private conversations. Nothing left behind.</title>
    <meta
      name="description"
      content="Create an encrypted chat, share your link, and let it disappear when you're done. End-to-end encrypted with Web Crypto AES-256-GCM."
    />
    <meta name="theme-color" content="#5B9EEA" />
    <meta name="color-scheme" content="light" />
    <meta property="og:title" content="PRVTCHAT — Private conversations. Nothing left behind." />
    <meta property="og:description" content="Ephemeral end-to-end encrypted messaging. Zero server logs. Built with Web Crypto AES-256-GCM." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://prvtchat.link" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PRVTCHAT — Private conversations." />
    <meta name="twitter:description" content="Ephemeral end-to-end encrypted messaging with zero server logs." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23000000' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><rect width='18' height='11' x='3' y='11' rx='2' ry='2'/><path d='M7 11V7a5 5 0 0 1 10 0v4'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      /* Critical inline styles for initial paint — prevents FOUC */
      #root-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background-color: #5B9EEA;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #root-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #root-loader .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255,255,255,0.2);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #root-loader .brand {
        color: white;
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.015em;
        opacity: 0.8;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#5B9EEA] text-[#0B132B] font-sans antialiased overflow-x-hidden selection:bg-[#0B0F19] selection:text-white">
    <!-- Initial loading state — removed once React hydrates -->
    <div id="root-loader" aria-label="Loading PRVTCHAT">
      <div class="spinner"></div>
      <div class="brand">PRVTCHAT</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove loader once React renders
      const observer = new MutationObserver(() => {
        const root = document.getElementById('root');
        if (root && root.childElementCount > 0) {
          const loader = document.getElementById('root-loader');
          if (loader) {
            loader.classList.add('fade-out');
            setTimeout(() => loader.remove(), 300);
          }
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
    </script>
  </body>
</html>
